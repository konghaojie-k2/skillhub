# My-Auth 配置文件模板
# 复制到你的项目根目录

[app]
name = "My API"
version = "0.1.0"
debug = true

[jwt]
# Access Token 过期时间（分钟）
access_token_expire = 30
# Refresh Token 过期时间（分钟）
refresh_token_expire = 1440

[database]
# 连接池大小
pool_size = 5

[cors]
# 允许的跨域来源
origins = ["http://localhost:3000", "http://localhost:8080"]

# 可选：钉钉登录配置
# [dingtalk]
# enabled = false
# redirect_uri = "http://localhost:3000/auth/dingtalk/callback"
